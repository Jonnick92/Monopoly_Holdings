<div class="first-row">
	<img src="simple_board_dark.png" class="game-board"/>
	<div class="right-column">
		<div class="player-info">
			@if (gameService.ownPlayerId()) {
				<div>{{ gameService.getPlayerById(playerId)?.name }}
					: {{ gameService.getPlayerById(playerId)?.balance }}
				</div>
			} @else {
				<div>Loading game data...</div>
			}
		</div>
		<div class="dice-display">
			<button
				class="new-holding-button"
				(click)="onNewHoldingClick()">
				Fund new Holding
			</button>
			<button 
				class="dice-button"
				(click)="onThrowDiceClick()"
				[disabled]="gameService.isUserTurn()">
				<img src="dice.png" alt="Dice button" class="dice" />
			</button>
			<img [src]="'dice' + gameService.diceOne() + '.png'" alt="Dice 1" class="dice"/>
			<img [src]="'dice' + gameService.diceTwo() + '.png'" alt="Dice 2" class="dice"/>
		</div>
		<div class="finance-info">
			<button class="nav-btn prev" (click)="onButtonPreviousClick()">
				<img src="arrow_back.png"/>
			</button>
			<div class="nav-dots">
				@for (dot of [0, 1, 2]; track $index) {
					<span class="dot" [class.active]="selectedDataField === dot"></span>
				}
			</div>
			<button class="nav-btn next" (click)="onButtonNextClick()">
				<img src="arrow_forward.png"/>
			</button>
		</div>
		<div class="content-section">
			<!-- TODO: Replace the anchor elements with the three component (player-overview, own-holdings, all-holdings)-->
			@switch (selectedDataField) {
				@case (0) {
					<app-game-player-list></app-game-player-list>
				}
				@case (1) {
					<a class="player-info">1</a>
				}
				@case (2) {
					<a class="player-info">2</a>
				}
			}
		</div>
		<div class="property-row">
			<app-game-property-list></app-game-property-list>
		</div>
	</div>
</div>
